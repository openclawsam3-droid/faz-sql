services:
  - type: web
    name: fadh-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python reply_bot.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
  - type: web
    name: fadh-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port \ --server.headless true
    envVars:
      - key: DATABASE_URL
        sync: false
